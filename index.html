<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার শপ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .active-thumb { border-color: #2563eb; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <!-- হেডার -->
    <header class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">আমার শপ</h1>
            <div class="relative">
                <span class="text-2xl">🛒</span>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full px-2 py-0.5">0</span>
            </div>
        </div>
    </header>

    <!-- প্রোডাক্ট এরিয়া -->
    <main class="container mx-auto p-4">
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </main>

    <script>
        // ১. আপনার GitHub-এ আপলোড থাকা ৪টি ফাইলের সঠিক নাম
        const products = [
            {
                id: 1, 
                name: "W11 Mini Smart Watch", 
                category: "Gadgets", 
                price: 1000, 
                images: [
                    "A to B.png",
                    "A to C.png",
                    "A to D.png",
                    "A to E.png"
                ] 
            }
        ];

        let cartCount = 0;

        // ২. প্রোডাক্ট রেন্ডার ফাংশন
        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = products.map(product => {
                const mainImg = product.images[0];
                const thumbsHtml = product.images.map((img, index) => `
                    <img src="${img}" 
                         onclick="changeImage(${product.id}, '${img}', this)" 
                         class="w-12 h-12 object-cover rounded border-2 cursor-pointer transition ${index === 0 ? 'active-thumb border-blue-600' : 'border-gray-200'}" />
                `).join('');

                return `
                    <div class="bg-white p-4 rounded-xl shadow-sm border hover:shadow-md transition">
                        <!-- প্রধান বড় ছবি -->
                        <div class="w-full h-64 overflow-hidden rounded-lg bg-gray-50 flex items-center justify-center mb-3">
                            <img id="main-img-${product.id}" src="${mainImg}" alt="${product.name}" class="w-full h-full object-cover">
                        </div>

                        <!-- থাম্বনেইল গ্যালারি (ছোট ছবিগুলো) -->
                        <div class="flex gap-2 mb-4 justify-center">
                            ${thumbsHtml}
                        </div>

                        <span class="text-xs uppercase tracking-wider text-gray-500 font-semibold">${product.category}</span>
                        <h2 class="text-lg font-bold text-gray-800 mt-1">${product.name}</h2>
                        <p class="text-blue-600 font-bold text-xl my-2">৳ ${product.price}</p>
                        
                        <button onclick="addToCart('${product.name}', ${product.price})" 
                                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition active:scale-95">
                            কার্টে যোগ করুন
                        </button>
                    </div>
                `;
            }).join('');
        }

        // ৩. ছবি চেঞ্জ করার ফাংশন
        function changeImage(productId, newSrc, el) {
            document.getElementById(`main-img-${productId}`).src = newSrc;
            
            const thumbs = el.parentElement.querySelectorAll('img');
            thumbs.forEach(t => t.classList.remove('active-thumb', 'border-blue-600'));
            thumbs.forEach(t => t.classList.add('border-gray-200'));
            
            el.classList.add('active-thumb', 'border-blue-600');
            el.classList.remove('border-gray-200');
        }

        // ৪. হোয়াটসঅ্যাপে অর্ডার পাঠানোর ফাংশন
        function addToCart(productName, price) {
            cartCount++;
            document.getElementById('cart-count').innerText = cartCount;

            const phone = "8801797662688";
            const message = `হ্যালো, আমি এই পণ্যটি অর্ডার করতে চাই:%0A- ${productName} (৳ ${price})`;
            const whatsappUrl = `https://wa.me/${phone}?text=${message}`;

            window.open(whatsappUrl, '_blank');
        }

        renderProducts();
    </script>
</body>
</html>
